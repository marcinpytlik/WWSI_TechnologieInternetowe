services:
  nginx:
    image: nginx:alpine
    container_name: ti-lab09-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ti-lab09-api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CourseDb: "Server=sqlserver,1433;Database=CourseDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ti-lab09-sql
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - lab09-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - backend-net

volumes:
  lab09-sql-data:

networks:
  frontend-net:
  backend-net:

services:
  frontend:
    image: nginx:alpine
    container_name: ti-lab07-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/html:/usr/share/nginx/html:ro
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ti-lab07-api
    env_file:
      - .env
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
      Jwt__Issuer: "CourseApi"
      Jwt__Audience: "CourseFrontend"
